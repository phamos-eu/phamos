[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "phamos"
authors = [
    { name = "Phamos GmbH", email = "support@phamos.eu" }
]
description = "Frappe/ERPNext custom app powering phamos.eu: cockpits, integrations and business processes for phamos GmbH."
license = "AGPL-3.0-only"
requires-python = ">=3.10,<3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "icalendar==6.1.1",
]

[project.urls]
Homepage = "https://github.com/phamos-eu/phamos"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
exclude = [
	"*.pyi",
	"**/apps/frappe/**/*.py",
	"**/apps/erpnext/**/*.py",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "N",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "N815", # mixedCase variable in class scope - DocType field names
    "N999", # invalid module name - Frappe auto-generates some module names
    "RUF001", # string contains ambiguous unicode character
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
]
typing-modules = ["frappe.types.DF"]

fixable = ["ALL"]
extend-unsafe-fixes = ["F401"] # imports may register hooks/DocTypes; don't auto-delete

[tool.ruff.lint.isort]
lines-after-imports = 2
