{% macro tile_card(item) %}
<div class="tile-card"
	data-tile-item
	data-name="{{ item.full_name }}"
	data-position="{{ item.position or '' }}"
	data-department="{{ item.department or '' }}"
	data-years="{{ item.years_at_phamos or 0 }}">
	<div class="tile-card-photo">
		{% if item.photo %}
		<img src="{{ item.photo }}" alt="{{ item.full_name }}" loading="lazy">
		{% else %}
		<div class="tile-card-photo-placeholder">{{ item.full_name[:1] }}</div>
		{% endif %}
	</div>
	<div class="tile-card-body">
		<div class="tile-card-title">{{ item.full_name }}</div>
		<div class="tile-card-subtitle">{{ item.position or '' }}</div>
		<div class="tile-card-stats">
			<span class="tile-card-chip">{{ item.department or '' }}</span>
			<span class="tile-card-chip tile-card-chip-stat">{{ item.years_at_phamos or 0 }} {{ _("Jahre") }}</span>
		</div>
	</div>
</div>
{% endmacro %}
