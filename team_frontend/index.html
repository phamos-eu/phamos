<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/assets/phamos/manifest/team-icon-192.png" />
		<link rel="apple-touch-icon" href="/assets/phamos/manifest/team-apple-touch-icon.png" />
		<link rel="manifest" href="/assets/phamos/manifest/team.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="Team Cockpit" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Team Cockpit</title>
		<meta name="theme-color" content="{{ theme_color or '#f8f8f8' }}" />
	</head>
	<body class="antialiased">
		<div id="app"></div>
		<div id="modals"></div>
		<div id="popovers"></div>

		<script>
			window.csrf_token = "{{ csrf_token }}"
			window.site_name = "{{ site_name }}"
			if (!window.frappe) window.frappe = {}
			frappe.boot = {{ boot }}
		</script>

		<script type="module" src="/src/main.js"></script>
	</body>
</html>
