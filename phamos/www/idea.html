<!DOCTYPE html>
<html lang="{{ lang }}">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<title>Idea</title>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Idea" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
		<link rel="icon" type="image/png" href="/assets/phamos/manifest/idea-icon-192.png" />
		<link rel="apple-touch-icon" href="/assets/phamos/manifest/idea-apple-touch-icon.png" />
		<link rel="manifest" href="/assets/phamos/manifest/idea.webmanifest" />
		<link rel="stylesheet" href="/assets/phamos/idea/idea.css?v={{ asset_version }}" />
		<script>
			// Pick the skin before the first paint: iPhone/iPad get the iOS look, everyone else Material (#2205).
			;(function () {
				var ua = navigator.userAgent
				var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
				document.documentElement.setAttribute("data-platform", ios ? "ios" : "android")
				// iOS: no flat theme-color, so Safari's status bar shows the page's glow instead of a
				// hard-edged strip; the glow layer reaches behind the Dynamic Island (#2218).
				if (ios) {
					document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
						m.remove()
					})
				}
			})()
		</script>
	</head>
	<body>
		<div class="app">
			<header class="bar">
				<button class="back-btn" id="back" hidden aria-label="Back">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
				</button>
				<div class="bar-title" id="bar-title">
					<svg class="bulb" viewBox="0 0 24 24" aria-hidden="true">
						<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z" />
					</svg>
					<span id="bar-label" data-t="Idea"></span>
				</div>
				<div class="bar-actions">
					<button class="queue-badge" id="queue" hidden></button>
					<!-- Shown when the browser offers to install the page as an app (#2217) -->
					<button class="install-btn" id="install" hidden>
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg>
						<span data-t="Install app"></span>
					</button>
				</div>
			</header>
			<!-- iPhone/iPad Safari has no install event: explain the share menu once (#2217) -->
			<div class="ios-hint" id="ios-hint" hidden>
				<span data-t="Add to your Home Screen: tap Share, then 'Add to Home Screen'."></span>
				<button class="ios-hint-close" id="ios-hint-close" aria-label="Close">&times;</button>
			</div>

			<!-- Catch: the start view (#2200) -->
			<section class="view" id="view-catch">
				<main class="capture">
					<textarea id="text" autofocus enterkeyhint="enter" autocapitalize="sentences" spellcheck="true"></textarea>
					<p class="hint" data-t="Type, or tap the microphone on your keyboard to dictate."></p>
				</main>
				<footer class="actions">
					<button class="btn btn-primary" id="save" disabled data-t="Save"></button>
				</footer>
			</section>

			<!-- My ideas: latest first (#2210) -->
			<section class="view scroll" id="view-ideas" hidden>
				<input class="search" id="ideas-search" type="search" autocomplete="off" />
				<label class="toggle"><input type="checkbox" id="ideas-closed" /> <span data-t="Show harvested and composted"></span></label>
				<ul class="list" id="ideas-list"></ul>
			</section>

			<!-- One of my ideas: read, edit, add to, grow, hand in (#2210) -->
			<section class="view scroll" id="view-detail" hidden>
				<textarea class="title-input" id="d-title" maxlength="140" rows="1"></textarea>
				<div class="grow">
					<div class="grow-stage">
						<span class="chip" id="d-stage"></span>
						<span class="grow-job" id="d-job"></span>
					</div>
					<div class="grow-buttons">
						<select class="stage-select" id="d-stage-select" aria-label="Stage"></select>
						<button class="btn btn-tonal btn-small" id="d-grow"></button>
					</div>
				</div>
				<div class="editor-tools" id="d-tools">
					<button data-cmd="bold" aria-label="Bold"><b>B</b></button>
					<button data-cmd="italic" aria-label="Italic"><i>I</i></button>
					<button data-cmd="h3" aria-label="Heading">H</button>
					<button data-cmd="insertUnorderedList" aria-label="List">•</button>
					<button data-cmd="insertOrderedList" aria-label="Numbered list">1.</button>
				</div>
				<div class="editor" id="d-content" contenteditable="true"></div>
				<div class="detail-actions">
					<button class="btn btn-primary" id="d-save" disabled data-t="Save changes"></button>
				</div>
				<div class="add-box">
					<div class="section-label" data-t="Add to this idea"></div>
					<textarea id="d-add" rows="3" autocapitalize="sentences"></textarea>
					<p class="choose-help" data-t="Your text goes to the bottom of this idea, with date and time."></p>
					<button class="btn btn-tonal" id="d-add-btn" disabled data-t="Add"></button>
				</div>
				<div class="vote-box">
					<div class="section-label" data-t="Vote"></div>
					<p class="vote-state" id="d-vote-state"></p>
					<button class="btn btn-tonal" id="d-vote-toggle"></button>
				</div>
			</section>

			<!-- Ideas up for vote, everyone's (#2210) -->
			<section class="view scroll" id="view-vote" hidden>
				<ul class="list" id="vote-list"></ul>
			</section>

			<!-- One idea up for vote -->
			<section class="view scroll" id="view-vote-detail" hidden>
				<h2 class="read-title" id="v-title"></h2>
				<p class="read-meta" id="v-meta"></p>
				<div class="read-content" id="v-content"></div>
				<div class="detail-actions">
					<button class="btn btn-primary" id="v-vote"></button>
				</div>
			</section>

			<nav class="tabbar" id="tabbar">
				<a class="tab" href="#/" data-tab="catch">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z" /></svg>
					<span data-t="Catch"></span>
				</a>
				<a class="tab" href="#/ideas" data-tab="ideas">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9" /></svg>
					<span data-t="My ideas"></span>
				</a>
				<a class="tab" href="#/vote" data-tab="vote">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" /></svg>
					<span data-t="Vote"></span>
				</a>
			</nav>
		</div>

		<div class="scrim" id="scrim" hidden></div>
		<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
			<div class="grabber"></div>
			<div class="sheet-head">
				<div>
					<div class="sheet-title" data-t="Idea saved"></div>
					<div class="sheet-sub" data-t="Does it belong to an existing idea?"></div>
				</div>
				<button class="btn btn-text" id="skip" data-t="Skip"></button>
			</div>
			<div class="suggest" id="suggest" hidden>
				<div class="section-label" data-t="Close in meaning"></div>
				<ul class="list" id="suggest-list"></ul>
			</div>
			<input class="search" id="search" type="search" autocomplete="off" />
			<ul class="list" id="list"></ul>
			<div class="choose" id="choose" hidden>
				<div class="choose-title" id="choose-title"></div>
				<div class="choose-buttons">
					<div class="choose-option">
						<button class="btn btn-tonal" id="spawned" data-t="Grew out of it"></button>
						<p class="choose-help" data-t="Stays its own idea, linked to this one."></p>
					</div>
					<div class="choose-option">
						<button class="btn btn-tonal" id="append" data-t="Add to it"></button>
						<p class="choose-help" data-t="Your text goes to the bottom of this idea, with date and time."></p>
					</div>
				</div>
			</div>
		</section>

		<div class="toast" id="toast" hidden></div>

		<script>
			window.csrf_token = "{{ csrf_token }}"
			window.idea_boot = {{ boot }}
		</script>
		<script src="/assets/phamos/idea/idea.js?v={{ asset_version }}"></script>
	</body>
</html>
