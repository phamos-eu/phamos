[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "phamos"
authors = [
    { name = "Phamos GmbH", email = "support@phamos.eu" }
]
description = "Frappe/ERPNext custom app powering phamos.eu: cockpits, integrations and business processes for phamos GmbH."
license = "AGPL-3.0-only"
requires-python = ">=3.10,<3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "icalendar==6.1.1",
]

[project.urls]
Homepage = "https://github.com/phamos-eu/phamos"
