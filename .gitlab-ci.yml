# GitLab CI for phamos.
#
# unit_tests
#   Runs the phamos test modules on fresh MariaDB / Redis services. The job
#   image (ci/image, built by ci/image/build.sh) already holds a Frappe v15
#   bench with ERPNext and HRMS and a saved test site; the job loads that site,
#   installs phamos from this checkout and runs the tests. GitLab counterpart
#   of .github/workflows/foundation.yml.
#   - CI_BENCH_TAG: image tag printed by build.sh. Rebuild the image and bump
#     the tag to pick up newer Frappe / ERPNext / HRMS code.
#   - TEST_MODULES: space-separated test modules, or "all" for the whole app.
#     Override it for one run in "Run pipeline".
#   - Set UNIT_TESTS_ENABLED=false (CI/CD variable) to turn the job off.
#   - Runs on the "hetzner" runner (Docker executor, arm64), so every image
#     below must have an arm64 build.
#
# ai_code_review
#   Reviews MRs targeting version-15 with Claude and posts findings as an MR
#   comment. Needs CI/CD variables ANTHROPIC_API_KEY and GITLAB_API_TOKEN; set
#   AI_REVIEW_ENABLED=false to disable.

workflow:
  rules:
    # One pipeline per change: an MR pipeline when the branch has an open MR,
    # a branch pipeline otherwise.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - ai-review

unit_tests:
  stage: test
  image: $CI_REGISTRY_IMAGE/ci-bench:$CI_BENCH_TAG
  tags: [hetzner]
  timeout: 90 minutes
  # The bench install takes most of the job. An interruptible job is canceled
  # mid-install when a newer pipeline starts, before any test runs.
  rules:
    - if: '$UNIT_TESTS_ENABLED == "false"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|version-15|release\/.+)$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(develop|version-15)$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  services:
    # Reachable as "mariadb", the alias GitLab derives from the image name.
    - name: mariadb:10.6
      command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    - name: redis:7-alpine
      alias: redis-cache
    - name: redis:7-alpine
      alias: redis-queue
  variables:
    # A new tag per build: the runner pulls "if-not-present", so a reused tag
    # would keep running the cached image.
    CI_BENCH_TAG: "v15-20261029"
    # Read by the mariadb service container.
    MARIADB_ROOT_PASSWORD: root
    MYSQL_ROOT_PASSWORD: root
    BENCH_DIR: /home/frappe/frappe-bench
    SITE: test.localhost
    # Lets `bench run-tests` run without allow_tests in the site config.
    CI: "true"
    # Same modules as .github/workflows/foundation.yml.
    TEST_MODULES: >-
      phamos.tests.test_api
      phamos.okr_addon.doctype.okr.test_okr
      phamos.okr_addon.doctype.kr.test_kr
      phamos.okr_addon.doctype.okr_team.test_okr_team
      phamos.phamos.doctype.stakeholder_meeting.test_stakeholder_meeting
      phamos.phamos.doctype.stakeholder_meeting.test_stakeholder_meeting_rules
      phamos.phamos.doctype.implementation_chapter.test_implementation_chapter
      phamos.phamos.doctype.implementation_chapter.test_implementation_chapter_rules
      phamos.phamos.doctype.implementation.test_implementation_review_cadence
      phamos.tests.test_backfill_chapter_revision_status_and_levels
      phamos.tests.test_web_profile_events
      phamos.tests.test_web_page_editing
      phamos.phamos.doctype.timesheet_record.test_timesheet_record
  script:
    - cd "$BENCH_DIR"

    # Saved test site from the image: Frappe, ERPNext, HRMS, setup wizard
    # fixtures, UTC time zone. Database name, user and password match
    # sites/test.localhost/site_config.json in the image.
    - |
      mariadb -hmariadb -uroot -proot -e "
        CREATE DATABASE test_site CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        CREATE USER 'test_site'@'%' IDENTIFIED BY 'test_site';
        GRANT ALL PRIVILEGES ON test_site.* TO 'test_site'@'%';"
      gunzip -c /home/frappe/seed.sql.gz | mariadb -hmariadb -uroot -proot test_site

    # phamos from this checkout.
    - cp -r "$CI_PROJECT_DIR" apps/phamos
    - ./env/bin/pip install -e apps/phamos
    - |
      # apps.txt may not end with a newline.
      if [ -s sites/apps.txt ] && [ -n "$(tail -c1 sites/apps.txt)" ]; then echo >> sites/apps.txt; fi
      grep -qxF phamos sites/apps.txt || echo phamos >> sites/apps.txt
    - bench --site "$SITE" install-app phamos
    # after_migrate creates custom fields the code needs (e.g. Sales Order Item.attendee).
    - bench --site "$SITE" migrate
    - |
      for app in erpnext hrms phamos; do
        bench --site "$SITE" list-apps | grep -q "$app" || { echo "Missing app: $app"; exit 1; }
      done
      bench --site "$SITE" mariadb -e "SELECT 1;" > /dev/null

    # Run every module, even after a failure, so the report shows all results.
    - |
      mkdir -p "$CI_PROJECT_DIR/test-results"
      if [ "$TEST_MODULES" = "all" ]; then
        bench --site "$SITE" run-tests --app phamos --junit-xml-output "$CI_PROJECT_DIR/test-results/phamos.xml"
      else
        failed=""
        for module in $TEST_MODULES; do
          echo "=== $module"
          bench --site "$SITE" run-tests --app phamos --module "$module" \
            --junit-xml-output "$CI_PROJECT_DIR/test-results/$module.xml" || failed="$failed $module"
        done
        if [ -n "$failed" ]; then
          echo "Failed test modules:$failed"
          exit 1
        fi
      fi
  after_script:
    - mkdir -p test-results/logs
    - cp -r "$BENCH_DIR/logs" test-results/logs/bench 2>/dev/null || true
    - cp -r "$BENCH_DIR/sites/$SITE/logs" test-results/logs/site 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - test-results/
    reports:
      junit: test-results/*.xml

ai_code_review:
  stage: ai-review
  image: python:3.10-slim
  needs: []
  rules:
    - if: '$AI_REVIEW_ENABLED == "false"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "version-15"'
  script:
    - python .gitlab/ai_code_review.py
