# =============================================================================
# Test Workflow
# =============================================================================
# Purpose:
#   Runs the Phamos unit test suite against the environment prepared by
#   foundation.yml. All environment setup, provisioning, and validation
#   lives there; this workflow only restores that environment and executes
#   tests.
#
# Depends on: .github/workflows/foundation.yml (called as a reusable job,
#   gated with `needs:`/`if:` below)
# =============================================================================

name: Run Tests

on:
  push:
    branches: [ version-15, develop, automated-testing ]
  pull_request:
    branches: [ version-15, develop ]

jobs:
  foundation:
    uses: ./.github/workflows/foundation.yml

  test:
    needs: foundation
    if: needs.foundation.result == 'success'
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_frappe
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis-cache:
        image: redis:alpine
        ports:
          - 6379:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 6380:6379

    steps:
    - name: Download environment artifact
      uses: actions/download-artifact@v4
      with:
        name: bench-environment

    - name: Restore environment
      run: |
        tar -xzf bench-environment.tar.gz

    - name: Restore site database
      working-directory: ./frappe-bench
      run: |
        backup_file=$(ls -t sites/test.localhost/private/backups/*-database.sql.gz | head -n 1)
        bench --site test.localhost restore "$backup_file" \
          --mariadb-root-username root \
          --mariadb-root-password root

    - name: Run Tests
      working-directory: ./frappe-bench
      run: |
        echo "Running phamos API tests..."
        bench --site test.localhost run-tests --app phamos --module phamos.tests.test_api

        echo "Running OKR tests..."
        bench --site test.localhost run-tests --app phamos --module phamos.okr_addon.doctype.okr.test_okr

        echo "Running KR tests..."
        bench --site test.localhost run-tests --app phamos --module phamos.okr_addon.doctype.kr.test_kr

        echo "Running OKR Team tests..."
        bench --site test.localhost run-tests --app phamos --module phamos.okr_addon.doctype.okr_team.test_okr_team

        echo "All tests completed successfully!"
      env:
        CI: true

    - name: Test Summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Tests completed" >> $GITHUB_STEP_SUMMARY

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          frappe-bench/sites/test.localhost/logs/
        retention-days: 7
        if-no-files-found: warn