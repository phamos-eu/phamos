<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Lead Scan</title>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Lead Scan" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="theme-color" content="#2563eb" />
		<link rel="icon" type="image/png" href="/assets/phamos/manifest/scan-icon-192.png" />
		<link rel="apple-touch-icon" href="/assets/phamos/manifest/scan-apple-touch-icon.png" />
		<link rel="manifest" href="/assets/phamos/manifest/scan.webmanifest" />
	</head>
	<body class="antialiased">
		<div id="app"></div>
		<div id="modals"></div>
		<div id="popovers"></div>

		<script>
			window.csrf_token = "{{ csrf_token }}"
			window.site_name = "{{ site_name }}"
			if (!window.frappe) window.frappe = {}
			frappe.boot = {{ boot }}
		</script>

		<script type="module" src="/src/main.js"></script>
	</body>
</html>
